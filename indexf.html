<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Elevations</title>
<style>
:root{
  --brand:#213e20; --cream:#fcf7e4;
  --bg:#f8f2e0; --panel:#fffcf1; --panel2:#f1ead6; --ink:#1c3a1c; --muted:#4d6149; --line:#dcd4bc;
  --accent:#2f5a2c; --accent-ink:#fcf7e4; --red:#b23a26; --bar:var(--brand); --bartext:var(--cream);
  --input:#f8f2e0; --sel:#e3ecd9; --sheet:#fffcf1;
  --ui:"Iosevka","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --cond:"Iosevka","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a0f; --panel:#162416; --panel2:#1f301f; --ink:#f3edd8; --muted:#b8c3ae; --line:#34482f;
    --accent:#8fbf7f; --accent-ink:#0f1a0f; --red:#ff8a70; --input:#0f1a0f; --sel:#1f341d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a0f; --panel:#162416; --panel2:#1f301f; --ink:#f3edd8; --muted:#b8c3ae; --line:#34482f;
  --accent:#8fbf7f; --accent-ink:#0f1a0f; --red:#ff8a70; --input:#0f1a0f; --sel:#1f341d;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--brand);color:var(--cream);border-bottom:3px solid var(--cream)}
header .logo{height:38px;width:auto;display:block;flex-shrink:0;border-radius:4px}
header .sub{font-size:10.5px;color:rgba(252,247,228,.72);margin-top:2px}
header h1{font-weight:700;font-size:13px;letter-spacing:.02em;margin:0;line-height:1.2;white-space:nowrap}
header .grow{flex:1}
.hbtn{background:rgba(252,247,228,.08);border:1px solid rgba(252,247,228,.35);color:var(--cream);padding:7px 12px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(252,247,228,.18)}
.hbtn.primary{background:var(--cream);border-color:var(--cream);color:var(--brand);font-weight:700}
.seg{display:inline-flex;border:1px solid rgba(252,247,228,.35);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--cream);padding:7px 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--brand);font-weight:700}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 380px;min-height:0}
aside.list{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.list-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px}
.list-head h2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0}
.list-items{overflow:auto;padding:0 8px 12px;flex:1}
.item{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:8px 10px;margin:2px 0;cursor:pointer}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--sel);border-color:var(--accent)}
.item b{font-size:15px;font-weight:700;display:block}
.item span{font-size:12px;color:var(--muted)}
.list-actions{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.btn{background:var(--input);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.sheet svg{display:block;width:100%;height:auto;max-height:74vh}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 6px}
.card p{margin:0 0 4px}
.card .big{font-size:17px;font-weight:700;color:var(--accent);line-height:1.25}
.card table{border-collapse:collapse;width:100%;font-size:13px}
.card td{padding:3px 0;border-bottom:1px dotted var(--line)}
.card td:last-child{text-align:right;font-size:13px;font-weight:700;color:var(--accent)}
aside.insp{border-left:1px solid var(--line);background:var(--bg);overflow:auto;min-height:0}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px;padding:0 12px 12px;overflow:hidden}
legend{display:block;width:calc(100% + 24px);margin:0 -12px 8px;padding:9px 12px;font-size:11.5px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;background:var(--panel2);color:var(--muted);border-bottom:1px solid var(--line)}
.f{display:grid;grid-template-columns:1fr 176px;align-items:center;gap:8px;margin:6px 0}
.f label{font-size:13px;color:var(--muted)}
.f input[type=text],.f select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-height:30px}
.f input.dim{font-size:15px;font-weight:700;color:var(--accent);text-align:right}
.f input.bad{border-color:var(--red);outline:1px solid var(--red)}
.f input:disabled{opacity:.55}
.f.check{grid-template-columns:auto 1fr}
.f.check label{color:var(--ink)}
.f.wide{grid-template-columns:1fr}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.section-svg{background:var(--sheet);border:1px solid var(--line);border-radius:3px;margin-top:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bartext);padding:9px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0;width:min(920px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,14,16,.45)}
.dlg{display:flex;flex-direction:column;max-height:88vh}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:15px;color:var(--accent);margin:0}
.dlg-body{padding:14px 18px;overflow:auto}
.dlg-body textarea{width:100%;min-height:130px;background:var(--input);border:1px solid var(--line);border-radius:4px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.ptable th{color:var(--muted);font-weight:600}
.warn{color:var(--red);font-size:13px}
@media (max-width: 1000px){
  main{grid-template-columns:1fr}
  aside.list{border-right:0;border-bottom:1px solid var(--line)}
  .list-items{display:flex;overflow-x:auto;gap:4px}
  .item{min-width:130px}
  aside.insp{border-left:0;border-top:1px solid var(--line)}
  header{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.bays{display:flex;flex-direction:column;gap:4px}
.bayrow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px;align-items:stretch}
.baysel{text-align:left;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;min-width:0}
.baysel b{display:block;font-size:13px}
.baysel span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bayrow.on .baysel{background:var(--sel);border-color:var(--accent)}
.mini{background:var(--input);border:1px solid var(--line);border-radius:6px;width:30px;cursor:pointer;font-size:11px;color:var(--muted)}
.mini:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mini.x:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.mini:disabled{opacity:.35;cursor:default}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.addrow .btn{font-size:12px}
.trcard{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;background:var(--bg)}
.subhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin:2px 0 4px}
.subhead .mini{height:26px}
.sheet rect[data-bay]:hover{fill:rgba(47,90,44,.06)}
.card td.hint,.card td.hint:last-child{text-align:left;font-weight:400;color:var(--muted);font-size:12px}
.preplist{margin:8px 0 2px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;line-height:1.5}
.preplist b{color:var(--accent);display:inline-block;min-width:46px}
</style>
</head>

<script>
/* ---------- constants ---------- */
const PROFILES=[
  ['DR-O','Double Rabbet – Open'],['DR-C','Double Rabbet – Closed'],
  ['SR-O','Single Rabbet – Open'],['SR-C','Single Rabbet – Closed'],
  ['CO-O','Cased Opening – Open'],['CO-C','Cased Opening – Closed'],
  ['DE-O','Double Egress – Open'],['DE-C','Double Egress – Closed']
];
const PNAME=Object.fromEntries(PROFILES);
const HAND_S=[['LH','LH'],['RH','RH'],['LHR','LHR'],['RHR','RHR']];
const HAND_P=[['LHA','LHA (left active)'],['RHA','RHA (right active)'],['LHRA','LHRA (left active)'],['RHRA','RHRA (right active)']];
const HAND_RMP=[['LHA','LH / RH'],['LHRA','LHR / RHR']];
const HAND_RMU=[['LHA','LH / RH, wide leaf left'],['RHA','LH / RH, wide leaf right'],['LHRA','LHR / RHR, wide leaf left'],['RHRA','LHR / RHR, wide leaf right']];
// Hardware dropdowns: same lists as the field tool, trimmed to what drives frame preps
const LOCKSET=["Cylindrical lock","Mortise lock","Deadlock","Panic - rim","Panic - surface vertical rod","Panic - concealed vertical rod","Panic - mortise","Push / Pull - no latch","None"];
const PAIR_CFGS={
  LOCK_FB_DUMMY:'Lockset active + flush bolts & dummy trim inactive',
  LOCK_FB_PULL:'Lockset active + flush bolts & pull inactive',
  FB_ONLY:'Flush bolts on inactive only',
  RIM_MULLION:'2 rim exit devices + removable mullion',
  RIM_FB:'Rim exit device active + flush bolts inactive',
  VR_BOTH:'2 vertical rod exit devices (both leaves active)',
  VR_FB:'Vertical rod device active + auto flush bolts inactive',
  MORT_VR:'Mortise exit device active + vertical rod device inactive',
  MORT_FB:'Mortise exit device active + flush bolts inactive',
  DE_LOCK_MULLION:'Lockset on each leaf + removable mullion',
  PUSHPULL:'Push / pull both leaves'
};
const CLOSER_HW=["None","Surface mount","Concealed"];
const OVERHEAD=["None","Surface mount","Concealed"];
const ELECTRIFIED=["None","Electric strike","Electrified lock","Electrified exit device","Electric hinge / power transfer","Mag lock"];
const HINGE_TYPES=["Butt Hinges","Continuous - Geared Concealed Leaf","Continuous - Geared Full Surface","Continuous - Pin & Barrel","Spring Hinges","Center-Hung Pivots","Offset Pivots"];
const HINGE_SIZES=['4-1/2" x 4-1/2" STD WT','4-1/2" x 4-1/2" HVY WT','5" x 4-1/2" STD WT','5" x 4-1/2" HVY WT','3-1/2" x 3-1/2" STD WT'];
const usesButt=t=>t==='Butt Hinges'||t==='Spring Hinges';
const isPivot=t=>/Pivot/.test(t);
const hingeHOf=b=>/^5/.test(b.hingeSize)?5:/^3-1\/2/.test(b.hingeSize)?3.5:4.5;
const isLockset=t=>['Cylindrical lock','Mortise lock','Deadlock'].includes(t);
function autoPairCfg(ls){
  switch(ls){
    case 'Cylindrical lock': case 'Mortise lock': return 'LOCK_FB_DUMMY';
    case 'Deadlock': return 'LOCK_FB_PULL';
    case 'Panic - rim': return 'RIM_MULLION';
    case 'Panic - surface vertical rod': case 'Panic - concealed vertical rod': return 'VR_BOTH';
    case 'Panic - mortise': return 'MORT_VR';
    case 'Push / Pull - no latch': return 'PUSHPULL';
    default: return 'FB_ONLY';
  }
}
function pairHW(b){
  const ls=b.lockset||'Cylindrical lock';
  const cfg=(b.pairCfg&&b.pairCfg!=='Auto'&&PAIR_CFGS[b.pairCfg])?b.pairCfg:autoPairCfg(ls);
  const vr=ls==='Panic - concealed vertical rod'?'Panic - concealed vertical rod':'Panic - surface vertical rod';
  const o={cfg,activeDevice:null,inactiveDevice:null,mullion:false,flushBolts:null};
  switch(cfg){
    case 'DE_LOCK_MULLION': o.activeDevice=isLockset(ls)?ls:'Cylindrical lock'; o.inactiveDevice=o.activeDevice; o.mullion=true; break;
    case 'LOCK_FB_DUMMY': case 'LOCK_FB_PULL': o.activeDevice=isLockset(ls)?ls:'Cylindrical lock'; o.flushBolts='Manual'; break;
    case 'FB_ONLY': o.activeDevice=(ls==='None'||ls==='Push / Pull - no latch')?null:ls; o.flushBolts='Manual'; break;
    case 'RIM_MULLION': o.activeDevice='Panic - rim'; o.inactiveDevice='Panic - rim'; o.mullion=true; break;
    case 'RIM_FB': o.activeDevice='Panic - rim'; o.flushBolts='Manual'; break;
    case 'VR_BOTH': o.activeDevice=vr; o.inactiveDevice=vr; break;
    case 'VR_FB': o.activeDevice=vr; o.flushBolts='Automatic'; break;
    case 'MORT_VR': o.activeDevice='Panic - mortise'; o.inactiveDevice='Panic - surface vertical rod'; break;
    case 'MORT_FB': o.activeDevice='Panic - mortise'; o.flushBolts='Manual'; break;
  }
  const ast=!!o.flushBolts||cfg==='MORT_VR';
  o.coordinator=b.closer!=='None'&&(ast||o.flushBolts==='Automatic');
  return o;
}
function syncCenter(b){ if(b.t==='door'&&b.config!=='single') b.center=pairHW(b).mullion?'removable':'meet'; }
// Frame preps for one door bay. Codes match the field tool.
function doorPreps(o,b){
  const pair=b.config!=='single', leaves=pair?2:1, items=[], notes=[], add=(code,label,qty=1)=>items.push({code,label,qty});
  const ph=pair?pairHW(b):null;
  const devs=pair?[ph.activeDevice,ph.inactiveDevice]:[b.lockset];
  let jamb=false, head=[];
  if(!pair){
    if(isLockset(b.lockset)||b.lockset==='Panic - mortise'){ add('STK','ASA 4-7/8" strike prep in jamb'); jamb=true; }
  }else{
    if(ph.mullion) add('MULL','Removable mullion head & sill retainers');
    if(ph.flushBolts){ add('H1','Flush bolt strike in head (ANSI 115.4)'); head.push('fb'); }
    if(ph.activeDevice&&(isLockset(ph.activeDevice)||ph.activeDevice==='Panic - mortise'||(ph.activeDevice==='Panic - rim'&&!ph.mullion))) notes.push('Active leaf strikes into inactive leaf (no jamb strike)');
    if(ph.mullion) notes.push('Rim strikes on mullion (no jamb strike)');
    if(ph.cfg==='PUSHPULL') notes.push('Push / pull both leaves, no latch');
  }
  devs.forEach(t=>{ if(!t) return;
    if(t==='Panic - rim'&&!(pair&&ph.mullion)){ add('RIM','Rim panic reinforcement'); if(!pair) jamb=true; }
    if(/surface vertical rod/.test(t)){ add('SVR','Rim vertical rod surface strike'); head.push('vr'); }
    if(/concealed vertical rod/.test(t)){ add('CVR','Vertical rod mortise strike in head'); head.push('vr'); } });
  if(b.closer!=='None') add('CR',b.closer==='Concealed'?'Concealed closer track in frame':'Surface closer reinforcing 14ga',leaves);
  if(ph&&ph.coordinator) add('COORD','Coordinator - face mounted');
  const ht=b.hingeType;
  if(usesButt(ht)) add(/^5/.test(b.hingeSize)?'5HNG':'HNG',(b.hingeSize.split(' x ')[0])+' hinge prep'+(ht==='Spring Hinges'?' (spring)':''),hinges(o,hingeHOf(b)).length*leaves);
  else if(/Full Surface/.test(ht)) add('CONT','Full surface continuous hinge prep',leaves);
  else if(isPivot(ht)) add('PIV','Top & bottom pivot set',leaves);
  else notes.push(ht+': no hinge preps in frame');
  if(b.electrified==='Electric strike'){ if(pair&&ph.mullion) notes.push('Electric strikes mount on the removable mullion (no frame prep)'); else add('ES','Electric strike prep w/ cover box'); }
  if(/EPT|transfer/i.test(b.electrified)) add('EPT','EPT prep w/ cover box');
  if(b.overhead==='Concealed') add('OHC','Overhead concealed holder prep',leaves);
  if(b.overhead==='Surface mount') add('OHS','Overhead stop & holder surface 14ga',leaves);
  return {items,notes,jamb,head,ph};
}
const CONFIG_NAME={single:'Single',pair:'Pair',unequal:'Unequal pair'};

/* ---------- model ---------- */
let uid=1;
const FRAME_DEF={mark:'',qty:1,doorH:84,profile:'DR-O',construction:'Welded',gauge:'16',wall:4.875,depthAuto:true,depth:5.875,
  jambFace:2,headFace:2,rabbet:1.9375,mullFace:2,mullProfile:'DR-C',mullMode:'stop',job:'',install:'wrap',wallType:'Masonry',saddle:0,saddleH:0.5,hwOperator:false,hwNotes:'',sizeMode:'manual',roW:0,roH:0,clrSide:0.25,clrHead:0.25,slLeft:0,slRight:0,trCount:0,looseAnchor:'Floor anchor + head clip',headClr:0.125,lockClr:0.125,meetClr:0.125,doorThk:'1-3/4"',prepStd:'pioneer',topHinge:5,botHinge:10,hingeH:4.5,strike:38,undercut:0.625,selBay:0};
// Frame prep standards (4-1/2" hinges): top of opening to top of top hinge, floor to bottom of bottom hinge,
// intermediates evenly spaced. Pioneer 7'-0": 5", 37-1/4", 69-1/2", strike 46" from top (38" AFF).
const PREP={
  pioneer:{name:'Pioneer',topHinge:5,botHinge:10,hingeH:4.5,strike:38,undercut:0.625},
  curries:{name:'Curries',topHinge:5,botHinge:10,hingeH:4.5,strike:40,undercut:0.625},
  ansi:{name:'ANSI / SDI generic',topHinge:5,botHinge:10,hingeH:4.5,strike:40.3125,undercut:0.75}
};
const PREP_KEYS=['topHinge','botHinge','strike','undercut'];
function matchPrep(o){ for(const k in PREP) if(PREP_KEYS.every(f=>Math.abs(o[f]-PREP[k][f])<1e-6)) return k; return 'custom'; }
const door=b=>Object.assign({config:'single',hand:'LH',leafW:36,activeW:36,inactiveW:12,center:'meet',lockset:'Cylindrical lock',pairCfg:'Auto',closer:'None',overhead:'None',electrified:'None',hingeType:'Butt Hinges',hingeSize:'4-1/2" x 4-1/2" STD WT',rmType:'keyed',rmW:2,rmD:3,mullL:'welded'},b||{},{t:'door'});
const slb=b=>Object.assign({w:12,fill:'glass',sill:2,rail:2,mullL:'welded',midRail:false,midH:36,midFace:2,lowerFill:'panel'},b||{},{t:'sl'});
const trn=t=>Object.assign({h:18,bar:2,fill:'glass'},t||{});
function normalize(raw){
  raw=raw||{}; const o=Object.assign({},FRAME_DEF);
  for(const k in FRAME_DEF) if(raw[k]!==undefined) o[k]=raw[k];
  if(Array.isArray(raw.bays)&&raw.bays.length) o.bays=raw.bays.map(b=>b&&b.t==='sl'?slb(b):door(b));
  else{
    const d=door({config:raw.config||'single',hand:raw.hand||'LH',leafW:raw.leafW??36,activeW:raw.activeW??36,inactiveW:raw.inactiveW??12});
    const s=raw.sl||'none', mk=()=>slb({w:raw.slW??12,fill:raw.slFill||'glass',sill:raw.slSill??2,rail:raw.slRail??2});
    o.bays=[]; if(s==='left'||s==='both') o.bays.push(mk()); o.bays.push(d); if(s==='right'||s==='both') o.bays.push(mk());
  }
  if(Array.isArray(raw.transoms)) o.transoms=raw.transoms.map(trn);
  else o.transoms=(raw.transom&&raw.transom!=='none')?[trn({h:raw.transomH??18,bar:raw.transomBar??2,fill:raw.transom})]:[];
  if(raw.mullMode===undefined) o.mullMode=(raw.mullThrough||(!Array.isArray(raw.transoms)&&raw.transomSpan==='door'))?'doors':'stop';
  if(!o.bays.some(b=>b.t==='door')) o.bays.push(door());
  o.bays.forEach(fixHand);
  (raw.bays||[]).forEach((rb,i)=>{ const b=o.bays[i]; if(!b||b.t!=='door'||!rb) return;
    if(rb.lockset===undefined){ if(raw.exitDev&&raw.exitDev!=='none') b.lockset='Panic - rim'; else if(rb.center==='removable') b.lockset='Panic - rim'; }
    if(rb.electrified===undefined&&raw.estrike) b.electrified='Electric strike';
    if(b.center==='removable'&&!pairHW(b).mullion) b.pairCfg='RIM_MULLION'; });
  o.selBay=Math.min(Math.max(0,o.selBay|0),o.bays.length-1);
  if(raw.prepStd===undefined){ // older saves: were on the generic default, move them to Pioneer
    if(raw.strike===undefined||(Math.abs(raw.strike-40.3125)<1e-6&&(raw.topHinge??5)===5&&(raw.botHinge??10)===10)) Object.assign(o,PREP.pioneer,{name:undefined});
    o.prepStd=matchPrep(o);
  }
  delete o.name; delete o.exitDev; delete o.estrike;
  o.id=uid++; return o;
}
function fixHand(b){
  if(b.t!=='door') return;
  let base=String(b.hand||'').toUpperCase().replace(/A$/,''); if(!/^(LH|RH)R?$/.test(base)) base='LH';
  b.hand=b.config==='single'?base:base+'A';
}

/* ---------- state ---------- */
let EXIT10;
let S={units:'ftin', sel:0, samples:['exit10'], items:[
  normalize({mark:'101'}),
  normalize({mark:'102', bays:[door({config:'unequal',hand:'RHA'})], transoms:[trn()]}),
  normalize({mark:'103', bays:[slb({w:18}),slb({w:18}),door({hand:'RHR'}),slb({w:18})], transoms:[trn({h:18}),trn({h:12})]}),
  normalize({mark:'104', bays:[door({hand:'LH'}),door({hand:'RH'})], transoms:[trn()], mullMode:'doors'}),
  EXIT10=normalize({mark:'Exit 10', job:'Herricks Community Center', install:'butt', wallType:'Masonry', depthAuto:false, depth:5, saddle:7, hwNotes:'(2) exit only rim devices, HES 9600 strikes on mullion. Auto operator TBD.',
    bays:[slb({sill:0,midRail:true,midH:36,fill:'glass',lowerFill:'panel'}),door({config:'pair',hand:'LHRA',leafW:36,center:'removable',lockset:'Panic - rim',electrified:'Electric strike'}),slb({sill:0,midRail:true,midH:36,fill:'glass',lowerFill:'panel'})],
    transoms:[trn({fill:'panel'}),trn({fill:'panel'})], mullMode:'each', sizeMode:'ro', roW:155, roH:151.5, slLeft:1, slRight:1, trCount:2}),
  normalize({mark:'105', bays:[slb(),door({hand:'RHR'}),slb()], transoms:[trn(),trn()], mullMode:'each', sizeMode:'ro', roW:76.5, roH:120.25, slLeft:1, slRight:1, trCount:2})
]};
function load(){
  try{
    let raw=localStorage.getItem('frameElev.v2')||localStorage.getItem('frameElev.v1');
    if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.items)&&d.items.length){S.units=d.units||'ftin'; S.items=d.items.map(normalize); S.sel=Math.min(d.sel||0,S.items.length-1);
      S.samples=Array.isArray(d.samples)?d.samples:[];
      if(!S.samples.includes('exit10')){ if(!S.items.some(o=>o.mark==='Exit 10')) S.items.push(normalize(JSON.parse(JSON.stringify(EXIT10)))); S.samples.push('exit10'); }}}
  }catch(e){}
}
function persist(){ try{localStorage.setItem('frameElev.v2',JSON.stringify({units:S.units,sel:S.sel,samples:S.samples,items:S.items}))}catch(e){} }
const cur=()=>S.items[S.sel];

/* ---------- dimension parsing & formatting ---------- */
function parseIn(s){
  s=s.trim(); if(!s) return 0;
  let m=s.match(/^(\d+(?:\.\d+)?)(?:[\s-]+(\d+)\/(\d+))?$/);
  if(m){let v=parseFloat(m[1]); if(m[2]){if(+m[3]===0) return NaN; v+=+m[2]/+m[3];} return v;}
  m=s.match(/^(\d+)\/(\d+)$/); if(m&&+m[2]) return +m[1]/+m[2];
  return NaN;
}
function parseDim(s){
  if(s==null) return NaN;
  s=String(s).trim().replace(/[″”“]/g,'"').replace(/[′’‘]/g,"'").replace(/\s*(in|inch|inches)\.?$/i,'');
  if(!s) return NaN;
  const m=s.match(/^(\d+(?:\.\d+)?)\s*'\s*-?\s*(.*)$/);
  if(m){const r=m[2].replace(/"/g,'').trim(); const i=r?parseIn(r):0; return isNaN(i)?NaN:parseFloat(m[1])*12+i;}
  return parseIn(s.replace(/"/g,''));
}
function frac(v){
  const n=Math.round(v*16), neg=n<0, a=Math.abs(n), w=Math.floor(a/16); let r=a%16, d=16;
  while(r&&r%2===0){r/=2;d/=2;}
  return (neg?'-':'')+(r?(w?w+' '+r+'/'+d:r+'/'+d):String(w));
}
function fmt(v){
  if(!isFinite(v)) return '—';
  if(S.units==='in') return frac(v)+'"';
  const n=Math.round(v*16), ft=Math.floor(n/192), inch=(n-ft*192)/16;
  return ft?ft+"'-"+frac(inch)+'"':frac(inch)+'"';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- geometry ---------- */
const hasRM=b=>b.t==='door'&&b.config!=='single'&&b.center==='removable';
const bayW=b=>b.t==='sl'?b.w:(b.config==='single'?b.leafW:b.config==='pair'?2*b.leafW:b.activeW+b.inactiveW);
const isContinuous=t=>/^Continuous/.test(t);
const hingeClr=b=>isContinuous(b.hingeType)?0.375:0.125;  // continuous hinge needs an extra 1/4" at the hinge edge (same as field tool)
const isRev=h=>/^(LH|RH)R/.test(h);
function labels(o){
  const d={}, s={}; let nd=0, ns=0;
  o.bays.forEach((b,i)=>{ if(b.t==='door') d[i]=String.fromCharCode(65+nd++); else s[i]=++ns; });
  return {d,s,nd,ns};
}
// Leaves are laid out on the NOMINAL opening (what the frame is built to); a..b is the actual door,
// undersized per SDI A250.8 / the field tool: 1/8" hinge edge (3/8" continuous), 1/8" lock edge,
// 1/8" total at meeting stiles, and removable mullion half-width + 1/8" each side.
function leavesFor(o,b,x0){
  const w=bayW(b), hs=hingeClr(b);
  if(b.config==='single'){
    const hL=b.hand[0]==='L', a=x0+(hL?hs:o.lockClr), bb=x0+w-(hL?o.lockClr:hs);
    return [{x0,x1:x0+w,a,b:bb,net:bb-a,hinge:b.hand[0],active:true,hand:b.hand,w}];
  }
  const actL=b.hand[0]==='L', rev=isRev(b.hand), rm=hasRM(b);
  const Lw=b.config==='pair'?b.leafW:(actL?b.activeW:b.inactiveW), Rw=w-Lw, sp=x0+Lw;
  const inner=rm?b.rmW/2+0.125:o.meetClr/2;
  const L={x0,x1:sp,a:x0+hs,b:sp-inner,hinge:'L',active:rm?true:actL,hand:rev?'LHR':'LH',w:Lw};
  const R={x0:sp,x1:x0+w,a:sp+inner,b:x0+w-hs,hinge:'R',active:rm?true:!actL,hand:rev?'RHR':'RH',w:Rw};
  L.net=L.b-L.a; R.net=R.b-R.a;

const netH=o=>o.doorH-o.headClr-o.undercut;
const fi=v=>frac(v)+'"';  // net door sizes are always given in inches, like the field tool
function netDoorText(b,o){
  const lv=leavesFor(o,b,0), h=fi(netH(o)), t=' x '+o.doorThk;
  if(b.config==='single') return fi(lv[0].net)+' x '+h+t;
  if(Math.abs(lv[0].net-lv[1].net)<1e-6) return '(2) '+fi(lv[0].net)+' x '+h+t;
  return '(1) '+fi(lv[0].net)+' + (1) '+fi(lv[1].net)+' x '+h+t;
}
function netDoorNote(b,o){
  const hs=hingeClr(b), hn=isContinuous(b.hingeType)?'continuous hinge edge':'hinge edge';
  if(b.config==='single') return 'Opening '+fmt(b.leafW)+' minus '+fmt(hs)+' '+hn+' and '+fmt(o.lockClr)+' lock edge';
  if(hasRM(b)) return 'Each leaf: nominal half minus '+fmt(hs)+' '+hn+', '+fmt(b.rmW/2)+' mullion half and '+fmt(0.125)+' at the mullion';
  return 'Each leaf: nominal minus '+fmt(hs)+' '+hn+' and '+fmt(o.meetClr/2)+' at the meeting edge ('+fmt(o.meetClr)+' gap)';
}
function geom(o){
  const jf=o.jambFace, hf=o.headFace, mf=o.mullFace, L=labels(o);
  const cols=[{k:'jamb',w:jf}];
  o.bays.forEach((b,i)=>{ if(i) cols.push({k:'mull',w:mf,loose:b.mullL==='loose',li:i-1,ri:i}); cols.push({k:b.t,w:bayW(b),bay:b,bi:i}); });
  cols.push({k:'jamb',w:jf});
  let x=0; cols.forEach(c=>{c.x=x;x+=c.w;});
  const W=x, trs=o.transoms, tr=trs.length>0;
  const rows=[]; let y=o.doorH;
  trs.forEach((t,i)=>{rows.push({i,barY:y,bar:t.bar,liteY:y+t.bar,h:t.h,fill:t.fill}); y+=t.bar+t.h;});
  const H=y+hf;
  const mode=(tr&&o.bays.length>1)?o.mullMode:'stop', through=mode!=='stop';

/* ---------- jamb section (schematic) ---------- */
function sectionSVG(o,prof,isFrame){
  const butt=isFrame&&o.install==='butt';
  const D=o.depth, W=Math.min(o.wall,D), F=o.jambFace, r=Math.min(o.rabbet,D/2), st=0.625, bb=0.5;
  const type=prof.slice(0,2), closed=prof.endsWith('C');
  const pad=0.9, minX=-pad, maxX=D+pad, minY=-F-1.6, maxY=st+0.9;
  const VW=300, sc=Math.min((VW-20)/(maxX-minX),150/(maxY-minY)), VH=(maxY-minY)*sc+10;
  const X=x=>10+(x-minX)*sc, Y=y=>5+(maxY-y)*sc;
  let pts=[[bb,-F],[0,-F],[0,0]];
  if(type==='CO') pts.push([D,0]);
  else if(type==='SR') pts.push([r,0],[r,st],[D,st]);
  else pts.push([r,0],[r,st],[D-r,st],[D-r,0],[D,0]);
  pts.push([D,-F],[D-bb,-F]);
  if(closed) pts.push([bb,-F]);
  const path=pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ')+(closed?' Z':'');
  const w0=butt?minX:(D-W)/2, wallTop=(closed||butt)?-F:-0.35, wallW=butt?(maxX-minX):W;
  return `<svg viewBox="0 0 ${VW} ${VH.toFixed(0)}" width="100%" role="img" aria-label="Jamb section">
    <defs><pattern id="wh${prof}" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#aaa498" stroke-width="1"/></pattern></defs>
    <rect x="${X(w0)}" y="${Y(wallTop)}" width="${wallW*sc}" height="${Y(minY)-Y(wallTop)}" fill="url(#wh${prof})" stroke="#aaa498"/>
    <path d="${path}" fill="${closed?'#C9D3C5':'none'}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="${X(D/2)}" y="${Y(maxY)+13}" font-family="${FONT}" font-size="12" font-weight="600" fill="${DIM}" text-anchor="middle">${esc(fmt(D))} jamb depth</text>
    <text x="${X(D/2)}" y="${Y(minY)-4}" font-family="${FONT}" font-size="11" font-weight="500" fill="#4d6149" text-anchor="middle">${butt?'butt frame in '+esc(o.wallType.toLowerCase())+' opening':esc(fmt(o.wall))+' wall'} · plan section, schematic</text>
  </svg>`;
}

function commit(path,v,structural){

  if(path==='sizeMode'&&v==='ro'){ const gg=geom(o); o.roW=gg.W+2*o.clrSide; o.roH=gg.H+o.clrHead; syncCounts(o); }
  if(path==='sizeMode'&&v==='manual') delete o._ro;
  if(['slLeft','slRight','trCount','sizeMode','saddle'].includes(path)||/\.(midRail|sill)$/.test(path)) structural=true;
  if(path==='install'&&v==='butt'){ o.depthAuto=false; }
  if(path==='install'&&v==='wrap'&&o.depthAuto) o.depth=o.wall+1;
  if(path==='prepStd'&&PREP[v]){ PREP_KEYS.forEach(k=>o[k]=PREP[v][k]); structural=true; }
  if(PREP_KEYS.includes(path)){ const m=matchPrep(o); if(m!==o.prepStd){ o.prepStd=m; const sel=document.getElementById('f_prepStd'); if(sel) sel.value=m; } }
  if(/\.config$/.test(path)){ const b=o.bays[o.selBay]; fixHand(b); if(v==='pair'&&b.leafW>48) b.leafW=36; }
  if(/\.center$/.test(path)){ const b=o.bays[o.selBay]; const m=pairHW(b).mullion;
    if(v==='removable'&&!m) b.pairCfg='RIM_MULLION'; if(v==='meet'&&m) b.pairCfg=b.lockset==='Panic - rim'?'RIM_FB':'Auto'; syncCenter(b); if(v==='meet'&&b.center==='removable'){ b.pairCfg='RIM_FB'; syncCenter(b);} }
  if(/\.(lockset|pairCfg|config)$/.test(path)){ syncCenter(o.bays[o.selBay]); }
  if(/\.(lockset|pairCfg|closer|overhead|electrified|hingeType|hingeSize)$/.test(path)) structural=true;
  if(/\.(config|center|lockset|pairCfg)$/.test(path)){ const b=o.bays[o.selBay]; if(hasRM(b)&&b.config==='pair') b.hand=isRev(b.hand)?'LHRA':'LHA'; }
  persist(); renderDrawing(); renderList();
  if(structural) renderInspector();
  else{

function nk(k){return k.toLowerCase().replace(/[^a-z0-9]/g,'');}
function fieldFor(k){
  const n=nk(k);
  if(/size/.test(n)) return 'size';
  if(/hand|swing/.test(n)) return 'hand';
  if(/profile|section|frametype|frame$|series|style/.test(n)) return 'profile';
  if(/depth|throat|jd$/.test(n)) return 'depth';
  if(/wall/.test(n)) return 'wall';

  if(/sidel|^sl$/.test(n)) return 'sl';
  if(/transom/.test(n)) return 'transom';
  if(/headface|headwidth/.test(n)) return 'headFace';
  if(/face/.test(n)) return 'jambFace';
  if(/qty|quantity|count/.test(n)) return 'qty';
  if(/const|weld|kd/.test(n)) return 'construction';
  if(/^(type|doortype|leaf|leaves|config|configuration|opening type)$/.test(n)) return 'type';
  if(/height|^h$|^ht$/.test(n)) return 'height';
  if(/width|^w$|^wd$/.test(n)) return 'width';
  if(/mark|opening|door|tag|^no$|number|item/.test(n)) return 'mark';
  return null;
}
function mapProfile(v){
  const u=' '+v.toUpperCase()+' ';
  const closed=/CLOSED|[\s-]C\s|\bCL\b|CLSD/.test(u);
  let t=null;
  if(/DOUBLE\s*EGRESS|\bDE\b/.test(u)) t='DE';
  else if(/DOUBLE\s*RAB|\bDR\b|\bDRO\b|\bDRC\b/.test(u)) t='DR';
  else if(/SINGLE\s*RAB|\bSR\b|\bSRO\b|\bSRC\b/.test(u)) t='SR';
  else if(/CASED|\bCO\b/.test(u)) t='CO';
  if(!t) return null;

  return t+'-'+(c?'C':'O');
}
function mapHand(v){
  const u=v.toUpperCase().replace(/[^A-Z]/g,'');

function codeToWH(c){

  if(+c.slice(3)>11) return null; return {w,h};

function parseSize(v){

  }

    const a=codeToWH(codes[codes.length-1]);

  }

  }

function applyField(o,f,v,raw){
  v=String(v).trim(); if(!v) return true;
  switch(f){

    case 'qty': {const n=parseInt(v,10); if(n>0){o.qty=n;return true;} return false;}
    case 'size': {const r=parseSize(v); if(r){Object.assign(o,r);return true;} return false;}

    case 'height': {const d=parseDim(v); if(d>0){o.doorH=d;return true;} return false;}
    case 'hand': {const h=mapHand(v); if(h){o.hand=h; if(/A$/.test(h)&&o.config==='single') o.config='pair'; return true;} return false;}
    case 'profile': {const p=mapProfile(v); if(p){o.profile=p;return true;} if(/PAIR|\bPR\b/i.test(v)){o.config='pair';return true;} return false;}
    case 'type': { if(/unequal|uneq/i.test(v)){o.config='unequal';return true;} if(/pair|\bpr\b|double door/i.test(v)){o.config='pair';return true;} if(/single|sgl/i.test(v)){o.config='single';return true;} const p=mapProfile(v); if(p){o.profile=p;return true;} return false;}
    case 'depth': {const d=parseDim(v); if(d>0){o.depth=d;o.depthAuto=false;o._depth=true;return true;} return false;}
    case 'wall': {const d=parseDim(v); if(d>0){o.wall=d; if(!o._depth) o.depth=d+1; return true;} return false;}
    case 'gauge': {const m=v.match(/1[2468]/); if(m){o.gauge=m[0];return true;} return false;}
    case 'jambFace': {const d=parseDim(v); if(d>0){o.jambFace=d;return true;} return false;}
    case 'headFace': {const d=parseDim(v); if(d>0){o.headFace=d;return true;} return false;}
    case 'construction': { if(/weld/i.test(v)) o.construction='Welded'; else if(/kd|knock/i.test(v)) o.construction='KD'; else if(/slip|drywall/i.test(v)) o.construction='Slip-on'; else return false; return true;}
    case 'sl': {
      if(/^(no|none|n|0|-)$/i.test(v)) return true;
      const u=v.toUpperCase();
      o.sl=/BOTH|\b2\b|L\s*[&+\/]\s*R/.test(u)?'both':/\bR(IGHT)?\b/.test(u)?'right':/\bL(EFT)?\b/.test(u)?'left':'left';
      const d=v.match(/(\d+(?:[\s-]\d+\/\d+)?(?:\.\d+)?)\s*"?/); if(d){const w=parseDim(d[1]); if(w>0&&w<60) o.slW=w;}

}
function freeformLine(line){
  const toks=line.split(/[\s,;|]+/).filter(Boolean); if(toks.length<2) return null;
  const o=legacy(); let hit=0;
  toks.forEach((t,i)=>{
    const sz=parseSize(t); if(sz&&/\d{4}/.test(t)){Object.assign(o,sz);hit++;return;}
    const h=mapHand(t); if(h&&t.replace(/[^A-Za-z]/g,'').length<=4&&/^[LR]H/i.test(t)){o.hand=h; if(/A$/.test(h)&&o.config==='single')o.config='pair'; hit++; return;}
    const p=mapProfile(t); if(p){o.profile=p;hit++;return;}
    if(/^(PR|PAIR)$/i.test(t)){o.config='pair';return;}
    if(i===0&&!o.mark) o.mark=t;
  });
  return hit>=1?o:null;
}

function parseTxt(text){
  const lines=text.replace(/\r/g,'').split('\n'), res=[], skipped=[];
  const nonblank=lines.filter(l=>l.trim());
  if(!nonblank.length) return {res,skipped};
  const delim=nonblank[0].includes('\t')?'\t':(nonblank[0].split(',').length>=3?',':null);
  if(delim){
    const head=nonblank[0].split(delim).map(s=>s.trim()), fields=head.map(fieldFor);
    if(fields.filter(Boolean).length>=2&&!head.some(h=>/^\d{4}$/.test(h))){
      nonblank.slice(1).forEach(l=>{ const cells=l.split(delim), o=legacy(); cells.forEach((c,i)=>{ if(fields[i]) applyField(o,fields[i],c); }); res.push(finalize(o)); });
      return {res,skipped,mode:'table'};
    }
  }
  let o=null, kvCount=0;
  const flush=()=>{ if(o&&o._hit) res.push(finalize(o)); o=null; };
  lines.forEach(l=>{
    if(!l.trim()){ flush(); return; }
    const m=l.match(/^\s*([A-Za-z][^:=\t]{0,40}?)\s*(?::|=|\t|\s{2,})\s*(.+?)\s*$/);
    if(m){ const f=fieldFor(m[1]);
      if(f){ kvCount++; if(f==='mark'&&o&&o.mark) flush(); if(!o) o=legacy(); if(applyField(o,f,m[2])){o._hit=true; return;} } }
    if(!kvCount){ const fo=freeformLine(l.trim()); if(fo){res.push(finalize(fo));return;} }
    skipped.push(l.trim());
  });
  flush();
  return {res,skipped,mode:kvCount?'keyvalue':'lines'};
}
function finalize(o){
  if(o._w){ if(o.config==='pair') o.leafW=o._w>=56?o._w/2:o._w; else if(o.config==='single') o.leafW=o._w; }
  if(!o._depth&&o.depthAuto) o.depth=o.wall+1;
  delete o._w; delete o._hit; delete o._depth;
  return normalize(o);
}
let pending=[];
function previewImport(){
  const txt=document.getElementById('dText').value, el=document.getElementById('dPreview');
  const {res,skipped}=parseTxt(txt); pending=res;
  if(!txt.trim()){el.innerHTML='';return;}
  if(!res.length){el.innerHTML=`<p class="warn">No openings found. Check that the file has a size (like 3070 or 3'-0 x 7'-0) or width and height for each opening, then send a sample so the reader can be matched to your export.</p>`;return;}
  el.innerHTML=`<table class="ptable"><thead><tr><th>Mark</th><th>Layout</th><th>Door size</th><th>Hand</th><th>Profile</th><th>Depth</th></tr></thead><tbody>${
    res.map(o=>`<tr><td>${esc(o.mark||'—')}</td><td>${esc(frameSummary(o))}</td><td>${esc(o.bays.filter(b=>b.t==='door').map(b=>doorSizeText(b,o)).join(', '))}</td><td>${esc(hands(o))}</td><td>${esc(PNAME[o.profile])}</td><td>${fmt(o.depth)}</td></tr>`).join('')
  }</tbody></table>${skipped.length?`<p class="hint" style="margin-top:10px">${skipped.length} line(s) not used: ${esc(skipped.slice(0,6).join(' | '))}${skipped.length>6?' …':''}</p>`:''}`;
}

/* ---------- downloads (local) ---------- */
function saveFile(name,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.svg')?'image/svg+xml':name.endsWith('.json')?'application/json':'text/plain'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Saved '+name);
  }catch(e){ toast('Couldn\'t save '+name); }
}
const fname=ext=>'elevation-'+(cur().mark||'opening').replace(/[^\w-]+/g,'_')+'.'+ext;
function toPng(){
  const svg=build(cur()), img=new Image();
  img.onload=()=>{
    const vb=svg.match(/viewBox="0 0 (\d+) (\d+)"/), w=+vb[1]*2, h=+vb[2]*2;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    c.toBlob(b=>{ if(b) saveFile(fname('png'),b); else toast('Couldn\'t render the PNG'); },'image/png');
  };
  img.onerror=()=>toast('Couldn\'t render the PNG');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- misc ui ---------- */
let tt;
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600);}
function nextMark(){ const nums=S.items.map(o=>parseInt(o.mark,10)).filter(n=>!isNaN(n)); return nums.length?String(Math.max(...nums)+1):'101'; }
const clone=o=>normalize(JSON.parse(JSON.stringify(o)));
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.item'); if(!b) return; S.sel=+b.dataset.i; persist(); renderAll();});
document.getElementById('sheet').addEventListener('click',e=>{const t=e.target.closest('[data-bay]'); if(!t) return; cur().selBay=+t.dataset.bay; persist(); renderInspector(); renderDrawing();});
document.getElementById('bNew').onclick=()=>{S.items.push(normalize({mark:nextMark()})); S.sel=S.items.length-1; persist(); renderAll(); const m=document.getElementById('f_mark'); if(m){m.focus();m.select();}};
document.getElementById('bDup').onclick=()=>{const c=clone(cur()); c.mark=nextMark(); S.items.splice(S.sel+1,0,c); S.sel++; persist(); renderAll(); toast('Duplicated as '+c.mark);};
document.getElementById('bDel').onclick=()=>{
  if(S.items.length===1){toast('Keep at least one opening'); return;}
  const m=cur().mark||'this opening'; if(!confirm('Delete '+m+'?')) return;
  S.items.splice(S.sel,1); S.sel=Math.max(0,S.sel-1); persist(); renderAll();
};
document.getElementById('uFt').onclick=()=>{S.units='ftin';persist();renderAll();};
document.getElementById('uIn').onclick=()=>{S.units='in';persist();renderAll();};
document.getElementById('bSvg').onclick=()=>saveFile(fname('svg'),build(cur()));
document.getElementById('bPng').onclick=toPng;
document.getElementById('bSave').onclick=()=>saveFile('frame-elevations.json',JSON.stringify({units:S.units,items:S.items},null,1));
document.getElementById('bOpen').onclick=()=>document.getElementById('fJson').click();
document.getElementById('fJson').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t); if(!d.items||!d.items.length) throw 0;
    S.items=d.items.map(normalize); S.units=d.units||S.units; S.sel=0; persist(); renderAll(); toast('Opened '+S.items.length+' openings'); })
   .catch(()=>toast('That file isn\'t a saved elevation project'));
  e.target.value='';
};
const dlg=document.getElementById('dImport');
document.getElementById('bImport').onclick=()=>{dlg.showModal(); previewImport();};
document.getElementById('dClose').onclick=document.getElementById('dCancel').onclick=()=>dlg.close();
document.getElementById('dPick').onclick=()=>document.getElementById('fTxt').click();
document.getElementById('fTxt').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{document.getElementById('dText').value=t; document.getElementById('dFile').textContent=f.name; previewImport();});
  e.target.value='';
};
document.getElementById('dText').addEventListener('input',previewImport);
document.getElementById('dGo').onclick=()=>{
  if(!pending.length){toast('Nothing to import yet'); return;}
  pending.forEach(o=>{ if(!o.mark) o.mark=nextMark(); S.items.push(o); });
  S.sel=S.items.length-pending.length; toast('Imported '+pending.length+' opening'+(pending.length>1?'s':''));
  pending=[]; document.getElementById('dText').value=''; document.getElementById('dPreview').innerHTML=''; document.getElementById('dFile').textContent='';
  dlg.close(); persist(); renderAll();
};
load(); wireInspector(); renderAll();

</script>
